<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="keywords" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jayoonmaeng is a multidisciplinary design practice exploring the intersections of material, form, and experience across physical and digital media.">
  <title>Jayoonmaeng — Design &amp; Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
  <link rel="stylesheet" href="./style.css?v=header-shade40">
  <script type="module" src="./app.js?v=header-blend"></script>
</head>
<body id="top">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="brand" href="#top" aria-label="Jayoonmaeng home">Jayoonmaeng</a>
    <nav class="masthead-nav" aria-label="Main navigation">
      <a href="./index.html#work">Archive</a>
      <div class="masthead-services">
        <a href="./services.html">Services</a>
        <ul class="service-nav"></ul>
      </div>
      <a href="./profile.html">Profile</a>
    </nav>
    <a class="email-link" href="./contact-card.html" target="jayoon-contact">Email.me</a>
  </header>

  <main id="main">
    <section id="work" class="work" tabindex="-1" aria-labelledby="work-title">
      <div class="section-heading">
        <div><h1 id="work-title">Archive<span>.</span></h1><p class="board-note label">Design across objects, interfaces, and experiences.</p></div>
        <div class="view-options label" role="group" aria-label="Work view" hidden>
          <button type="button" aria-controls="board" aria-pressed="true">Board</button>
          <button type="button" aria-controls="work-index" aria-pressed="false">Index</button>
        </div>
      </div>
      <div id="board" class="board"></div>
      <div id="work-index" hidden>
        <div class="index-labels label" aria-hidden="true"><span>PROJECT</span><span>CATEGORY</span></div>
        <ul class="index"></ul>
      </div>
    </section>

    <section id="lab" class="lab" aria-labelledby="lab-title">
      <div class="lab-copy">
        <p class="label">THREE.JS / ORBITAL</p>
        <h2 id="lab-title" lang="en">Lab<span>.</span></h2>
        <div class="lab-intro"></div>
      </div>
      <div class="scene">
        <div class="fallback" aria-hidden="true"></div>
        <canvas id="orbital" aria-hidden="true"></canvas>
        <button class="motion-toggle label" type="button" hidden>Pause motion</button>
      </div>
    </section>

    <div class="lab-studies" aria-label="Lab studies"></div>

    <section id="contact" class="info" tabindex="-1" aria-labelledby="contact-title">
      <h2 id="contact-title" lang="en">Contact<span>.</span></h2>
      <div class="info-copy contact-copy content-stack"></div>
    </section>
  </main>

  <footer class="footer label"><span>JAYOON / PORTFOLIO</span><a href="#top">Back to top</a></footer>
  <dialog id="project-dialog" aria-labelledby="project-title">
    <header class="detail-bar">
      <span class="brand">Jayoonmaeng</span>
      <form method="dialog">
        <button class="close label" aria-label="Close project" autofocus>Back to work <span aria-hidden="true">×</span></button>
      </form>
    </header>
    <div class="detail-layout">
      <section class="detail-copy" aria-labelledby="project-title">
        <h2 id="project-title" lang="en"></h2>
        <p id="project-subtitle" class="project-subtitle"></p>
        <p id="project-description"></p>
        <dl class="detail-meta"></dl>
        <div class="detail-lists content-stack"></div>
        <a class="project-lab-link label" hidden></a>
      </section>
      <div class="detail-gallery" aria-label="Project images"></div>
    </div>
  </dialog>
</body>
</html>
